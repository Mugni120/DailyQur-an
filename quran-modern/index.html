<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Qur'an Modern PRO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
  <div id="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">ق</span>
        <div class="logo-text">
          <h1>Al-Qur'an Modern <span>PRO</span></h1>
          <p>114 Surah · Tajwid Interaktif · Murottal 7 Qari Dunia</p>
        </div>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" data-tab="surahs">114 Surah</button>
        <button class="nav-btn" data-tab="tajwid">Tajwid Interaktif</button>
        <button class="nav-btn" data-tab="hadits">Hadist Shahih</button>
        <button class="nav-btn" data-tab="hafidz">Latihan Hafidz</button>
      </nav>
      <div class="theme-controls">
        <button id="theme-toggle" class="btn-icon" title="Ganti Tema">🌓</button>
      </div>
    </header>

    <main class="main-content" id="main-view">
      <!-- Dynamic views loaded by js/app.js -->
    </main>

    <div class="audio-dock" id="audio-dock">
      <div class="audio-info">
        <div id="playing-surah">Al-Fatihah : Ayat 1</div>
        <div id="playing-qari" class="sub">Misyari Rasyid Al-'Afasy</div>
      </div>
      <div class="audio-controls">
        <button id="btn-prev" class="btn-ctrl">⏮</button>
        <button id="btn-play" class="btn-ctrl play-btn">▶</button>
        <button id="btn-next" class="btn-ctrl">⏭</button>
      </div>
      <div class="audio-options">
        <button id="btn-repeat" class="btn-badge">1x Ulang</button>
        <button id="btn-speed" class="btn-badge">1.0x</button>
      </div>
    </div>
  </div>

  <script src="data/surahs.js"></script>
  <script src="data/quran-data.js"></script>
  <script src="data/tajwid-data.js"></script>
  <script src="data/hadiths-data.js"></script>
  <script src="data/qari-data.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/hafidz-trainer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
